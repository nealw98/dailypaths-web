name: Refresh Reader Favorites

# Reader favorites are captured quarterly rather than read on every nightly
# build, so card ordering and featured readings change on a known schedule
# instead of drifting overnight. Run it by hand any time from the Actions tab.
on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'  # 1st of January, April, July, October
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Capture reader favorites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/capture-favorites.mjs

      # The nightly build picks the new snapshot up. Trigger Build and Deploy
      # manually if the refreshed ordering should go live sooner.
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/favorites-snapshot.json
          if git diff --staged --quiet; then
            echo "Favorites unchanged since the last capture"
          else
            git commit -m "Refresh reader favorites — $(date -u +'%Y-%m-%d')"
            git push
          fi
