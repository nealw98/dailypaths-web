name: Build and Deploy Static Site

on:
  schedule:
    - cron: '0 5 * * *'  # 5am UTC daily (midnight ET)
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_ENV: production
        run: node build.mjs

      # A broken site index is worse than a stale one, so a bad build stops here
      # rather than being published to dailypaths.org.
      - name: Verify the site index
        run: node scripts/check-sitemap.mjs docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ seo-lastmod.json
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Daily rebuild — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
