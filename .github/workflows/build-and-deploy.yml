name: Build and Deploy Static Site

on:
  # The nightly rebuild is started at midnight Eastern by the Supabase job
  # 'site-daily-rebuild' (see supabase/migrations), because GitHub starts
  # scheduled runs hours late. This schedule is only a fallback; the build picks
  # the New York date, so a late or repeated run is harmless.
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:  # Supabase job, or by hand from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_ENV: production
        run: node build.mjs

      # A broken site index is worse than a stale one, so a bad build stops here
      # rather than being published to dailypaths.org.
      - name: Verify the site index
        run: node scripts/check-sitemap.mjs docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ seo-lastmod.json data/favorites-snapshot.json data/reading-slugs.json data/story-room-cache.json
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Daily rebuild — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
